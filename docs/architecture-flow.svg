<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PreFlight QC architecture</title>
  <desc id="desc">A flow from raw quality control output through four agents to a grounded delivery decision and ClickHouse audit record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef5f8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2d52" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#16b8b0"/></marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#0b2d52">How PreFlight QC turns QC into action</text>
  <text x="100" y="153" font-family="Arial, sans-serif" font-size="25" fill="#52708d">A grounded, multi-agent path from validator findings to an auditable next attempt</text>

  <g filter="url(#shadow)">
    <rect x="100" y="315" width="205" height="180" rx="18" fill="#0b2d52"/>
    <text x="202" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">RAW QC</text>
    <text x="202" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#dceaf7">Photon findings</text>
    <text x="202" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#dceaf7">codes + context</text>
  </g>
  <line x1="305" y1="405" x2="365" y2="405" stroke="#16b8b0" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="375" y="270" width="250" height="250" rx="18" fill="white" stroke="#16b8b0" stroke-width="4"/>
    <text x="500" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0b2d52">SPEC-READER</text>
    <text x="500" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">Grounds findings</text>
    <text x="500" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">against delivery</text>
    <text x="500" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">requirements</text>
    <text x="500" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#16a39d">Gemini on Vertex AI</text>
  </g>
  <line x1="625" y1="405" x2="685" y2="405" stroke="#16b8b0" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="695" y="270" width="250" height="250" rx="18" fill="white" stroke="#16b8b0" stroke-width="4"/>
    <text x="820" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0b2d52">QC-ANALYST</text>
    <text x="820" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">Queries delivery</text>
    <text x="820" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">history through</text>
    <text x="820" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">ClickHouse MCP</text>
    <text x="820" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#16a39d">Deterministic risk score</text>
  </g>
  <line x1="945" y1="405" x2="1005" y2="405" stroke="#16b8b0" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1015" y="270" width="250" height="250" rx="18" fill="white" stroke="#16b8b0" stroke-width="4"/>
    <text x="1140" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0b2d52">ORCHESTRATOR</text>
    <text x="1140" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">Combines evidence</text>
    <text x="1140" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">into a delivery</text>
    <text x="1140" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#52708d">decision</text>
    <text x="1140" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#16a39d">Redeliver / waive / investigate</text>
  </g>
  <line x1="1265" y1="405" x2="1325" y2="405" stroke="#16b8b0" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1335" y="315" width="205" height="180" rx="18" fill="#0b2d52"/>
    <text x="1437" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">ACTION</text>
    <text x="1437" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#dceaf7">Redelivery record</text>
    <text x="1437" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#dceaf7">filed to ClickHouse</text>
  </g>

  <rect x="375" y="650" width="890" height="100" rx="50" fill="#d9f6f3" stroke="#16b8b0" stroke-width="3"/>
  <text x="820" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0b625f">Every decision becomes queryable history for the next delivery</text>
</svg>
