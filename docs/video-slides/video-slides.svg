<svg xmlns="http://www.w3.org/2000/svg" width="7680" height="1080" viewBox="0 0 7680 1080">
  <rect width="7680" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="18" fill="#11b9b1"/>
  <style>
    .title{font-family:Arial,sans-serif;font-size:68px;font-weight:700;fill:#0b2d52}
    .subtitle{font-family:Arial,sans-serif;font-size:34px;fill:#52708d}
    .heading{font-family:Arial,sans-serif;font-size:46px;font-weight:700;fill:#0b2d52}
    .body{font-family:Arial,sans-serif;font-size:30px;fill:#365a78}
    .small{font-family:Arial,sans-serif;font-size:24px;fill:#52708d}
    .accent{font-family:Arial,sans-serif;font-size:26px;font-weight:700;fill:#078f8b}
  </style>

  <!-- Slide 1: title -->
  <g id="title-slide">
    <rect x="145" y="280" width="150" height="150" rx="24" fill="#0b2d52"/>
    <rect x="180" y="315" width="80" height="62" rx="8" fill="white"/>
    <path d="M195 345 l18 18 32-38" stroke="#11b9b1" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="270" cy="420" r="38" fill="#11b9b1" stroke="#0b2d52" stroke-width="8"/>
    <path d="M253 420 l13 13 24-28" stroke="white" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="350" y="375" class="title">PREFLIGHT <tspan fill="#11b9b1">QC</tspan></text>
    <text x="355" y="435" class="subtitle">IMF DELIVERY  •  GROUNDED DECISIONS  •  AUDITABLE ACTION</text>
    <text x="960" y="780" text-anchor="middle" class="small">A decision layer after quality-control validation</text>
  </g>

  <!-- Slide 2: IMF -->
  <g id="imf-slide" transform="translate(1920 0)">
    <text x="130" y="150" class="heading">Why IMF delivery needs a decision layer</text>
    <text x="130" y="215" class="subtitle">One master. Many versions. A network of dependencies.</text>
    <g transform="translate(180 330)">
      <rect width="270" height="190" rx="20" fill="#0b2d52"/>
      <text x="135" y="75" text-anchor="middle" fill="white" class="heading" font-size="34">MASTER</text>
      <text x="135" y="125" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">shared picture</text>
      <text x="135" y="160" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">and audio assets</text>
    </g>
    <path d="M465 425 H610" stroke="#11b9b1" stroke-width="9"/>
    <path d="M600 408 l30 17-30 17" fill="#11b9b1"/>
    <g transform="translate(650 275)">
      <rect width="330" height="300" rx="20" fill="white" stroke="#11b9b1" stroke-width="4"/>
      <text x="165" y="70" text-anchor="middle" class="heading" font-size="34">IMF PACKAGE</text>
      <text x="165" y="135" text-anchor="middle" class="body" font-size="27">CPL playlists</text>
      <text x="165" y="180" text-anchor="middle" class="body" font-size="27">PKL + AssetMap</text>
      <text x="165" y="225" text-anchor="middle" class="body" font-size="27">track files + metadata</text>
      <text x="165" y="270" text-anchor="middle" class="accent">versioned delivery</text>
    </g>
    <path d="M1000 425 H1135" stroke="#11b9b1" stroke-width="9"/>
    <path d="M1125 408 l30 17-30 17" fill="#11b9b1"/>
    <g transform="translate(1180 330)">
      <rect width="270" height="190" rx="20" fill="#0b2d52"/>
      <text x="135" y="75" text-anchor="middle" fill="white" class="heading" font-size="34">VERSIONS</text>
      <text x="135" y="125" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">language</text>
      <text x="135" y="160" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">territory + edit</text>
    </g>
    <rect x="400" y="750" width="1120" height="105" rx="52" fill="#d9f6f3"/>
    <text x="960" y="818" text-anchor="middle" class="accent" font-size="30">If one reference or requirement fails, the delivery can fail at ingest.</text>
  </g>

  <!-- Slide 3: workflow -->
  <g id="workflow-slide" transform="translate(3840 0)">
    <text x="130" y="150" class="heading">What happens while the analysis runs</text>
    <text x="130" y="215" class="subtitle">Four specialized agents. One operational recommendation.</text>
    <g transform="translate(120 355)">
      <rect width="300" height="210" rx="20" fill="#0b2d52"/>
      <text x="150" y="75" text-anchor="middle" fill="white" class="heading" font-size="32">SPEC-READER</text>
      <text x="150" y="130" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">delivery requirements</text>
      <text x="150" y="170" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">and evidence</text>
    </g>
    <text x="470" y="475" text-anchor="middle" class="accent" font-size="48">→</text>
    <g transform="translate(560 355)">
      <rect width="300" height="210" rx="20" fill="white" stroke="#11b9b1" stroke-width="4"/>
      <text x="150" y="75" text-anchor="middle" class="heading" font-size="32">QC-ANALYST</text>
      <text x="150" y="130" text-anchor="middle" class="body" font-size="26">ClickHouse history</text>
      <text x="150" y="170" text-anchor="middle" class="body" font-size="26">through MCP</text>
    </g>
    <text x="910" y="475" text-anchor="middle" class="accent" font-size="48">→</text>
    <g transform="translate(1000 355)">
      <rect width="300" height="210" rx="20" fill="white" stroke="#11b9b1" stroke-width="4"/>
      <text x="150" y="75" text-anchor="middle" class="heading" font-size="32">ORCHESTRATOR</text>
      <text x="150" y="130" text-anchor="middle" class="body" font-size="26">evidence + history</text>
      <text x="150" y="170" text-anchor="middle" class="body" font-size="26">→ recommendation</text>
    </g>
    <text x="1350" y="475" text-anchor="middle" class="accent" font-size="48">→</text>
    <g transform="translate(1440 355)">
      <rect width="300" height="210" rx="20" fill="#0b2d52"/>
      <text x="150" y="75" text-anchor="middle" fill="white" class="heading" font-size="32">ACTION AGENT</text>
      <text x="150" y="130" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">redelivery record</text>
      <text x="150" y="170" text-anchor="middle" fill="#dceaf7" class="body" font-size="26">to ClickHouse</text>
    </g>
    <rect x="380" y="760" width="1160" height="100" rx="50" fill="#d9f6f3"/>
    <text x="960" y="824" text-anchor="middle" class="accent" font-size="30">Gemini explains. Deterministic code scores. ClickHouse preserves the history.</text>
  </g>

  <!-- Slide 4: outcome -->
  <g id="outcome-slide" transform="translate(5760 0)">
    <text x="130" y="150" class="heading">From validator output to the next safe attempt</text>
    <text x="130" y="215" class="subtitle">The result is a decision a delivery team can act on.</text>
    <g transform="translate(170 330)">
      <rect width="470" height="300" rx="22" fill="#fff5f6" stroke="#e28a96" stroke-width="4"/>
      <text x="235" y="80" text-anchor="middle" fill="#9d3743" class="heading" font-size="34">RAW FINDING</text>
      <text x="235" y="145" text-anchor="middle" class="body" font-size="28">technical error code</text>
      <text x="235" y="190" text-anchor="middle" class="body" font-size="28">missing asset or metadata</text>
      <text x="235" y="245" text-anchor="middle" fill="#9d3743" class="accent" font-size="28">needs interpretation</text>
    </g>
    <text x="790" y="495" text-anchor="middle" class="accent" font-size="70">→</text>
    <g transform="translate(980 300)">
      <rect width="650" height="360" rx="22" fill="white" stroke="#11b9b1" stroke-width="5"/>
      <text x="325" y="78" text-anchor="middle" class="heading" font-size="34">PREFLIGHT QC DECISION</text>
      <text x="80" y="145" class="body" font-size="28">What failed?</text>
      <text x="80" y="195" class="body" font-size="28">Why does it matter?</text>
      <text x="80" y="245" class="body" font-size="28">What should be fixed?</text>
      <text x="80" y="295" class="body" font-size="28">What gets recorded?</text>
    </g>
    <rect x="330" y="790" width="1260" height="100" rx="50" fill="#0b2d52"/>
    <text x="960" y="855" text-anchor="middle" fill="white" class="heading" font-size="32">IMF delivery  •  grounded decisions  •  auditable action</text>
  </g>
</svg>
