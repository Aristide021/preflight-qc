[project]
name = "preflight-qc"
version = "0.1.0"
description = "Multi-agent system for media delivery QC compliance, redelivery filing, and historical failure prediction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# ─────────────────────────────────────────────────────────────────────────────
# RUNTIME dependencies
# These are what the deployed project actually calls — satisfying the
# hackathon requirement that Google Cloud SDK is "imported and called at runtime"
# and that no non-Google AI SDKs are present.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    # Google AI — the two required runtime paths
    "google-adk>=1.0.0", # Agent Development Kit — orchestration, Runner, tools
    "google-genai>=1.0.0", # Gemini inference (genai.Client, GenerativeModel)
    # ClickHouse connectivity
    "clickhouse-connect>=0.7.0", # ClickHouse Python driver (used alongside MCP)
    "mcp>=1.24,<2", # Model Context Protocol client — must be <2 for google-adk compat
    # Data / validation
    "pydantic>=2.0.0", # Typed models for QC results, classifications, risk scores
    "httpx>=0.27.0", # Async HTTP for spec fetching
    "tenacity>=8.0.0", # Retry logic for MCP / ClickHouse calls
    # Runtime utilities
    "python-dotenv>=1.0.0", # Load .env in local dev (Secret Manager in prod)
    "structlog>=24.0.0", # Structured logging
    "rich>=13.0.0", # Pretty CLI output
    "mcp-clickhouse>=0.4.1",
]

[project.optional-dependencies]
# Development + testing only — NONE of these are imported in the runtime path
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# Data generator — runs offline, never in the deployed agent path
generator = [
    "faker>=25.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that hit live ClickHouse Cloud (deselect with -m 'not integration')",
    "gate: marks go/no-go gate tests",
]
